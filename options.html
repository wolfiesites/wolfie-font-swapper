<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title data-i18n="options_title">Wolfie Font Swapper — opcje</title>
  <style>
    :root {
      --bg: #1e1e24; --surface: #2a2a33; --text: #f2f2f5; --muted: #9a9aa8;
      --accent: #ff3dae; --accent2: #00e0ff; --border: #3c3c47;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
      display: flex; justify-content: center; padding: 40px 16px;
    }
    .card { width: 100%; max-width: 460px; }
    .head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
    }
    .head img { width: 40px; height: 40px; display: block; }
    .head h1 { margin: 0; font-size: 18px; font-weight: 800; }
    .field {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    .desc { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    select {
      width: 100%; padding: 9px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 14px;
    }
    select:focus { outline: none; border-color: var(--accent); }
    .saved { margin-top: 10px; min-height: 16px; font-size: 12px; color: #4cd964; }
    .foot { margin-top: 22px; text-align: center; font-size: 12px; color: var(--muted); }
    .foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img src="icons/wolfie-logo.svg" alt="Wolfie" />
      <h1>Wolfie Font Swapper</h1>
    </div>
    <div class="field">
      <label data-i18n="options_lang_label">Język interfejsu</label>
      <div class="desc" data-i18n="options_lang_desc">Domyślnie język przeglądarki. Wybierz, aby wymusić.</div>
      <select id="lang"></select>
      <div id="saved" class="saved"></div>
    </div>
    <div class="foot">
      Created by
      <a href="https://wolfiesites.com" target="_blank" rel="noopener noreferrer">Wolfie</a>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
