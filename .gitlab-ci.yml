# Pipeline Wolfie Font Swapper — JEDNO repo, DWA niezależne buildy rozdzielone
# po ścieżkach zmienionych plików (GitLab `rules: changes:`). Na branchu
# `production`:
#
#   • Zmiany w plikach DODATKU (manifest.json, *.js/html/css, fonts/, icons/,
#     licenses/)  →  build:zip + publish:wppw  (paczka CWS → api.wppw.pl).
#     Strona NIE jest budowana ani ruszana.
#
#   • Zmiany w plikach STRONY (store/site/**, store/build-site.cjs,
#     store/policy.html)  →  build:site (+ publish:site).  Dodatek NIE jest
#     budowany ani publikowany.
#
# Czyli: edytujesz tylko stronę → leci tylko strona; podbijasz wersję dodatku
# (manifest.json) → leci tylko nowy release dodatku. Nic się nie miesza.
#
# Platforma dodatku: WolfieGuard / api.wppw.pl (rejestr, license-gated). Upload:
# POST /api/service/products/<slug>/releases z nagłówkiem X-Service-Key.
#
# WYMAGANE zmienne CI/CD (Settings → CI/CD → Variables; Masked + Protected):
#   WPPW_SERVICE_KEY     service key do api.wppw.pl (X-Service-Key, products.write)
# OPCJONALNE (sensowne domyślne):
#   WPPW_UPLOAD_URL      domyślnie https://api.wppw.pl/api/service/products/$PKG_NAME/releases
#   WPPW_UPLOADER_EMAIL  e-mail do audit logu (domyślnie wit.paw4@gmail.com)
# OPCJONALNE — auto-deploy strony (gdy ustawione, publish:site wgrywa stronę):
#   WFS_DEPLOY_SSH_KEY   prywatny klucz SSH (ed25519) do hosta strony
#   WFS_DEPLOY_TARGET    cel rsync, np. user@host:/var/www/wfs
#   WFS_DEPLOY_SSH_OPTS  (opc.) dodatkowe opcje ssh; WFS_DEPLOY_STRICT (opc.) yes/no
# Dopóki klucze nie są ustawione, kroki publish kończą się „skipped" (zielono);
# artefakty (ZIP dodatku / zbudowana strona) i tak są dostępne w pipeline.

stages: [build, publish]
# redeploy: production is now a protected branch so WFS_DEPLOY_SSH_KEY reaches publish:site

variables:
  PKG_NAME: "wolfie-font-swapper"

# ── Ścieżki dodatku (paczka CWS). Zmiana któregokolwiek → build/publish dodatku.
.extension_changes: &extension_changes
  - manifest.json
  - "*.js"
  - "*.html"
  - "*.css"
  - fonts/**/*
  - icons/**/*
  - licenses/**/*

# ── Ścieżki strony (landing wfs). Zmiana któregokolwiek → build/deploy strony.
# `.gitlab-ci.yml` included so a change to the pipeline/deploy config itself
# re-runs the site build+deploy (also lets us trigger a redeploy on demand).
.site_changes: &site_changes
  - store/site/**/*
  - store/build-site.cjs
  - store/policy.html
  - .gitlab-ci.yml

# ════════════════════════ DODATEK (Chrome Web Store) ════════════════════════

build:zip:
  stage: build
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes: *extension_changes
  before_script:
    - apk add --no-cache git zip jq
  script:
    - VERSION=$(jq -r .version manifest.json)
    - ZIP="${PKG_NAME}-${VERSION}.zip"
    # Paczka = wszystkie śledzone pliki MINUS materiały nie-dodatkowe.
    - mkdir -p pkg
    - git archive HEAD | tar -x -C pkg
    - rm -rf pkg/docs pkg/assets pkg/store
    - rm -f pkg/*.md pkg/CLAUDE.md pkg/.gitignore pkg/.gitlab-ci.yml
    - 'rm -f pkg/_tmp* pkg/assets/generate.py 2>/dev/null || true'
    - (cd pkg && zip -r "../$ZIP" . -x "*.DS_Store")
    - echo "Built $ZIP"; unzip -l "$ZIP"
    - echo "VERSION=$VERSION" > build.env
    - echo "ZIP=$ZIP" >> build.env
  artifacts:
    name: "wfs-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "*.zip"
    expire_in: 90 days
    reports:
      dotenv: build.env

publish:wppw:
  stage: publish
  image: alpine:3.20
  needs: ["build:zip"]
  # Self-hosted runner na zima (docker executor, sieć `platform`) → upload leci
  # po sieci WEWNĘTRZNEJ do kontenera api-wppw, omijając Cloudflare. URL ustawia
  # zmienna CI WPPW_UPLOAD_URL = http://api-wppw:3000/api/service/products/<slug>/releases
  tags: [zima]
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes: *extension_changes
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - 'URL="${WPPW_UPLOAD_URL:-https://api.wppw.pl/api/service/products/${PKG_NAME}/releases}"'
    - |
      if [ -z "$WPPW_SERVICE_KEY" ]; then
        echo "WPPW_SERVICE_KEY nieustawiony — pomijam upload (ZIP zostaje w artefaktach)."
        echo "Ustaw go w GitLab → Settings → CI/CD → Variables (Masked, Protected)."
        exit 0
      fi
    - SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
    # SvelteKit CSRF odrzuca multipart POST bez pasującego Origin (403). app
    # (adapter-node bez ORIGIN env) liczy url.origin jako HTTPS + host, nawet gdy
    # łączymy się po http — więc Origin MUSI mieć schemat https + host docelowy.
    - ORIGIN="https://$(echo "$URL" | sed -E 's#^https?://([^/]+).*#\1#')"
    - echo "Uploading $ZIP (v$VERSION, sha256=$SHA) → $URL (origin $ORIGIN)"
    # Produkt auto-tworzy się przy 1. uploadzie po slug ($PKG_NAME). Wymagane:
    # version, sha256, file, uploaderEmail. Powtórka tej samej wersji = 409
    # (podbij version w manifest.json). Aby było PRYWATNE/superorg: raz wywołaj
    # set_product_visibility { private } przez MCP api.wppw.pl.
    - |
      HTTP=$(curl -s -o resp.txt -w "%{http_code}" -X POST \
        -H "X-Service-Key: $WPPW_SERVICE_KEY" \
        -H "Origin: $ORIGIN" \
        -A "wfs-gitlab-ci/1.0" \
        -F "version=${VERSION}" \
        -F "sha256=${SHA}" \
        -F "uploaderEmail=${WPPW_UPLOADER_EMAIL:-wit.paw4@gmail.com}" \
        -F "productName=Wolfie Font Swapper" \
        -F "uploadOrigin=gitlab-ci" \
        -F "file=@${ZIP}" \
        "$URL")
      echo "HTTP $HTTP"
      echo "--- response ---"; cat resp.txt; echo
      case "$HTTP" in
        2*)  echo "OK — release $VERSION wysłany do api.wppw.pl" ;;
        409) echo "Already published: $VERSION (bump manifest.json version dla nowego release)" ;;
        *)   echo "Upload failed (HTTP $HTTP)"; exit 1 ;;
      esac

# ════════════════════════ STRONA (landing wfs.wolfiesites.com) ════════════════

build:site:
  stage: build
  image: node:20-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes: *site_changes
  script:
    # Generuje wszystkie locale (en + pl/de/fr/es/uk/ru/ro/it) + sitemap/robots
    # z szablonu store/site/ — build-site.cjs nie ma zależności npm.
    - node store/build-site.cjs
    - echo "Pages built:"; find store/site -name index.html | sort
  artifacts:
    name: "wfs-site-${CI_COMMIT_SHORT_SHA}"
    paths:
      - store/site/
    expire_in: 90 days

publish:site:
  stage: publish
  image: alpine:3.20
  needs: ["build:site"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes: *site_changes
  before_script:
    - apk add --no-cache openssh-client
  script:
    - |
      set -e
      if [ -z "${WFS_DEPLOY_SSH_KEY:-}" ] || [ -z "${WFS_DEPLOY_TARGET:-}" ]; then
        echo "WFS_DEPLOY_* not set — built site is in the build:site artifact; skipping upload."
        echo "Set WFS_DEPLOY_SSH_KEY + WFS_DEPLOY_TARGET in GitLab CI/CD variables to auto-deploy."
        exit 0
      fi
      mkdir -p "$HOME/.ssh"
      printf '%s\n' "$WFS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
      chmod 600 "$HOME/.ssh/id_deploy"
      SSHOPTS="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=${WFS_DEPLOY_STRICT:-no} -o BatchMode=yes ${WFS_DEPLOY_SSH_OPTS:-}"
      USERHOST="${WFS_DEPLOY_TARGET%%:*}"
      REMOTE_PATH="${WFS_DEPLOY_TARGET#*:}"
      [ -n "$REMOTE_PATH" ] && [ "$REMOTE_PATH" != "$WFS_DEPLOY_TARGET" ] || { echo "WFS_DEPLOY_TARGET must be user@host:/path"; exit 1; }
      echo "Deploying store/site/ -> $USERHOST:$REMOTE_PATH (tar over ssh — immune to remote login-shell banners that break rsync)"
      ssh $SSHOPTS "$USERHOST" "mkdir -p '$REMOTE_PATH'"
      tar -C store/site -czf - . | ssh $SSHOPTS "$USERHOST" "tar -C '$REMOTE_PATH' -xzf -"
      echo "Deployed (tar extract — overwrites changed files; does not prune files removed from source)."
