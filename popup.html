<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Wolfie Font Swapper</title>
</head>
<body>
  <header class="wfs-header">
    <a href="https://wolfiesites.com" target="_blank" rel="noopener noreferrer" title="wolfiesites.com">
      <img class="wfs-logo" src="icons/wolfie-logo.svg" width="32" height="32" alt="Wolfie" />
    </a>
    <h1>Wolfie Font Swapper</h1>
    <button id="wfs-picker" class="wfs-iconbtn wfs-picker" type="button" data-i18n-title="picker_title" title="Pobierz font ze strony" aria-label="Pick font">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.5"></circle>
        <line x1="12" y1="1.5" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22.5"></line>
        <line x1="1.5" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22.5" y2="12"></line>
      </svg>
    </button>
    <button id="wfs-settings" class="wfs-iconbtn wfs-settings" type="button" data-i18n-title="settings_title" title="Ustawienia" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button id="wfs-minimize" class="wfs-iconbtn wfs-minimize" type="button" data-i18n-title="minimize_title" title="Zwiń do ikony" aria-label="Minimize">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </header>

  <main>
    <div class="wfs-toprow">
      <button id="wfs-edit-text" class="wfs-edit-btn" type="button" data-i18n="edit_text_btn" data-i18n-title="edit_text_title" title="Edytuj tekst na stronie">✎ Tekst</button>
      <button id="wfs-reset-top" class="wfs-reset-mini" type="button" data-i18n="reset_btn" data-i18n-title="reset_btn" title="Resetuj (usuń podmianę)">↺ Resetuj (usuń podmianę)</button>
    </div>

    <div id="wfs-rulebar" class="wfs-rulebar" hidden>
      <span class="wfs-rule-label" data-i18n="rule_domain_active">Reguła domeny aktywna</span>
      <button id="wfs-rule-remove" type="button" class="wfs-rule-remove" data-i18n="rule_remove_domain" data-i18n-title="rule_remove_domain" title="Usuń regułę dla tej domeny">✕ Usuń regułę</button>
    </div>

    <!-- CAŁA STRONA -->
    <section class="wfs-field">
      <label><span data-i18n="sec_base">Cała strona</span></label>
      <div class="wfs-combo" data-target="base">
        <input type="text" class="wfs-search" data-i18n-ph="ph_base" placeholder="Szukaj fontu… (np. Roboto)" autocomplete="off" />
        <button class="wfs-clear" type="button" data-i18n-title="clear_title" title="Wyczyść wybór">✕</button>
        <ul class="wfs-options" hidden></ul>
      </div>
      <div class="wfs-chips"></div>
    </section>

    <!-- NAGŁÓWKI -->
    <section class="wfs-field">
      <label><span data-i18n="sec_headings">Nagłówki</span> <small data-i18n="sub_headings">(h1–h6, opcjonalne)</small></label>
      <div class="wfs-combo" data-target="headings">
        <input type="text" class="wfs-search" data-i18n-ph="ph_headings" placeholder="Szukaj fontu dla nagłówków…" autocomplete="off" />
        <button class="wfs-clear" type="button" data-i18n-title="clear_title" title="Wyczyść wybór">✕</button>
        <ul class="wfs-options" hidden></ul>
      </div>
      <div class="wfs-chips"></div>
    </section>

    <!-- AKAPITY -->
    <section class="wfs-field">
      <label><span data-i18n="sec_paragraphs">Akapity</span> <small data-i18n="sub_paragraphs">(p, opcjonalne)</small></label>
      <div class="wfs-combo" data-target="paragraphs">
        <input type="text" class="wfs-search" data-i18n-ph="ph_paragraphs" placeholder="Szukaj fontu dla akapitów…" autocomplete="off" />
        <button class="wfs-clear" type="button" data-i18n-title="clear_title" title="Wyczyść wybór">✕</button>
        <ul class="wfs-options" hidden></ul>
      </div>
      <div class="wfs-chips"></div>
    </section>

    <!-- NAWIGACJA -->
    <section class="wfs-field">
      <label><span data-i18n="sec_navigation">Nawigacja</span> <small data-i18n="sub_navigation">(nav, opcjonalne)</small></label>
      <div class="wfs-combo" data-target="navigation">
        <input type="text" class="wfs-search" data-i18n-ph="ph_navigation" placeholder="Szukaj fontu dla nawigacji…" autocomplete="off" />
        <button class="wfs-clear" type="button" data-i18n-title="clear_title" title="Wyczyść wybór">✕</button>
        <ul class="wfs-options" hidden></ul>
      </div>
      <div class="wfs-chips"></div>
    </section>

    <!-- PRZYCISKI -->
    <section class="wfs-field">
      <label><span data-i18n="sec_buttons">Przyciski</span> <small data-i18n="sub_buttons">(button, .btn, opcjonalne)</small></label>
      <div class="wfs-combo" data-target="buttons">
        <input type="text" class="wfs-search" data-i18n-ph="ph_buttons" placeholder="Szukaj fontu dla przycisków…" autocomplete="off" />
        <button class="wfs-clear" type="button" data-i18n-title="clear_title" title="Wyczyść wybór">✕</button>
        <ul class="wfs-options" hidden></ul>
      </div>
      <div class="wfs-chips"></div>
    </section>

    <!-- PRESETY -->
    <section class="wfs-presets">
      <div class="wfs-presets-head">
        <span class="wfs-presets-label" data-i18n="presets_label">Presety</span>
        <button id="wfs-save-preset" type="button" class="wfs-preset-save" data-i18n="preset_save">＋ Zapisz</button>
      </div>
      <div id="wfs-preset-list" class="wfs-preset-list"></div>
    </section>

    <div class="wfs-actions">
      <button id="wfs-reset" type="button" class="wfs-btn-reset" data-i18n="reset_btn">↺ Resetuj (usuń podmianę)</button>
    </div>

    <!-- SNIPPET DO SKOPIOWANIA -->
    <section id="wfs-snippet" class="wfs-snippet" hidden>
      <div class="wfs-snippet-head">
        <div class="wfs-tabs" role="tablist">
          <button class="wfs-tab active" data-tab="css" type="button">CSS</button>
          <button class="wfs-tab" data-tab="scss" type="button">SCSS</button>
          <button class="wfs-tab" data-tab="js" type="button">JS</button>
        </div>
        <div class="wfs-snippet-actions">
          <span id="wfs-paid" class="wfs-paid" hidden>PAID</span>
          <a id="wfs-buy" class="wfs-buy" href="#" target="_blank" rel="noopener noreferrer" hidden data-i18n="buy_font">Kup font</a>
          <button id="wfs-copy" class="wfs-copy" type="button" data-i18n-title="copy_title" data-i18n="copy_btn" title="Kopiuj do schowka">⧉ Kopiuj</button>
        </div>
      </div>
      <pre class="wfs-code"><code id="wfs-code"></code></pre>
    </section>

    <p id="wfs-status" class="wfs-status"></p>
  </main>

  <!-- Zadokowany pasek (nie scrolluje się): aktualny wybór GŁÓWNEGO pickera + 3 kontrolki -->
  <div id="wfs-stylepick" class="wfs-stylepick" hidden>
    <span class="wfs-stylepick-name" id="wfs-stylepick-name"></span>
    <div class="wfs-stylepick-actions">
      <button id="wfs-stylepick-copy" type="button" class="wfs-stylepick-btn" data-i18n-title="stylepick_copy" title="Kopiuj styl CSS">⧉</button>
      <button id="wfs-stylepick-add" type="button" class="wfs-stylepick-btn" data-i18n-title="stylepick_add" title="Dodaj do moich fontów">＋</button>
      <button id="wfs-stylepick-del" type="button" class="wfs-stylepick-btn wfs-stylepick-del" data-i18n-title="stylepick_del" title="Usuń pick z biblioteki">✕</button>
    </div>
  </div>

  <footer class="wfs-footer">
    <a class="wfs-coffee" href="https://buymeacoffee.com/wolfiesites" target="_blank" rel="noopener noreferrer" title="buy me a coffee">☕ buy me a coffee</a>
    <span class="wfs-credit">Created by <a href="https://wolfiesites.com" target="_blank" rel="noopener noreferrer">Wolfie</a></span>
    <span id="wfs-version" class="wfs-version"></span>
  </footer>

  <script src="i18n.js"></script>
  <script src="fonts.js"></script>
  <script src="fonts-meta.js"></script>
  <script src="popup.js"></script>
</body>
</html>
