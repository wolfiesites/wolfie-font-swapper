# Pipeline publikacji Wolfie Font Swapper.
#
# Na branchu `production` (np. po zmergowaniu z `main`):
#   1. build:zip   — buduje paczkę rozszerzenia gotową do Chrome Web Store
#                    (tylko pliki dodatku; bez docs/assets/store/*.md/CI),
#   2. publish:wppw — wysyła ZIP do api.wppw.pl (prywatnie, za kluczem API).
#
# Platforma: WolfieGuard / api.wppw.pl (rejestr oprogramowania, license-gated).
# Upload release'u: POST /api/service/products/<slug>/releases z nagłówkiem
# X-Service-Key (klucz z mint_service_key / mint_vendor_api_key).
#
# WYMAGANE zmienne CI/CD (Settings → CI/CD → Variables; Masked + Protected):
#   WPPW_SERVICE_KEY     service key do api.wppw.pl (nagłówek X-Service-Key,
#                        scope products.write; mint: mint_service_key)
# OPCJONALNE (mają sensowne domyślne):
#   WPPW_UPLOAD_URL      domyślnie https://api.wppw.pl/api/service/products/$PKG_NAME/releases
#   WPPW_UPLOADER_EMAIL  e-mail do audit logu (domyślnie wit.paw4@gmail.com)
#
# Dopóki WPPW_SERVICE_KEY nie jest ustawiony, krok publish kończy się „skipped"
# (nie wysyła nic) — pipeline pozostaje zielony, a ZIP jest w artefaktach.
# Produkt (slug = wolfie-font-swapper) AUTO-tworzy się przy 1. uploadzie — nie
# trzeba create_product. Aby release był prywatny/superorg: raz wywołaj
# set_product_visibility { private } przez MCP api.wppw.pl.

stages: [build, publish]

variables:
  PKG_NAME: "wolfie-font-swapper"

build:zip:
  stage: build
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  before_script:
    - apk add --no-cache git zip jq
  script:
    - VERSION=$(jq -r .version manifest.json)
    - ZIP="${PKG_NAME}-${VERSION}.zip"
    # Paczka = wszystkie śledzone pliki MINUS materiały nie-dodatkowe.
    - mkdir -p pkg
    - git archive HEAD | tar -x -C pkg
    - rm -rf pkg/docs pkg/assets pkg/store
    - rm -f pkg/*.md pkg/CLAUDE.md pkg/.gitignore pkg/.gitlab-ci.yml
    - 'rm -f pkg/_tmp* pkg/assets/generate.py 2>/dev/null || true'
    - (cd pkg && zip -r "../$ZIP" . -x "*.DS_Store")
    - echo "Built $ZIP"; unzip -l "$ZIP"
    - echo "VERSION=$VERSION" > build.env
    - echo "ZIP=$ZIP" >> build.env
  artifacts:
    name: "wfs-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "*.zip"
    expire_in: 90 days
    reports:
      dotenv: build.env

publish:wppw:
  stage: publish
  image: alpine:3.20
  needs: ["build:zip"]
  # Self-hosted runner na zima (docker executor, sieć `platform`) → upload leci
  # po sieci WEWNĘTRZNEJ do kontenera api-wppw, omijając Cloudflare. URL ustawia
  # zmienna CI WPPW_UPLOAD_URL = http://api-wppw:3000/api/service/products/<slug>/releases
  tags: [zima]
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - 'URL="${WPPW_UPLOAD_URL:-https://api.wppw.pl/api/service/products/${PKG_NAME}/releases}"'
    - |
      if [ -z "$WPPW_SERVICE_KEY" ]; then
        echo "WPPW_SERVICE_KEY nieustawiony — pomijam upload (ZIP zostaje w artefaktach)."
        echo "Ustaw go w GitLab → Settings → CI/CD → Variables (Masked, Protected)."
        exit 0
      fi
    - SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
    # SvelteKit CSRF odrzuca multipart POST bez pasującego Origin (403). app
    # (adapter-node bez ORIGIN env) liczy url.origin jako HTTPS + host, nawet gdy
    # łączymy się po http — więc Origin MUSI mieć schemat https + host docelowy.
    - ORIGIN="https://$(echo "$URL" | sed -E 's#^https?://([^/]+).*#\1#')"
    - echo "Uploading $ZIP (v$VERSION, sha256=$SHA) → $URL (origin $ORIGIN)"
    # Produkt auto-tworzy się przy 1. uploadzie po slug ($PKG_NAME). Wymagane:
    # version, sha256, file, uploaderEmail. Powtórka tej samej wersji = 409
    # (podbij version w manifest.json). Aby było PRYWATNE/superorg: raz wywołaj
    # set_product_visibility { private } przez MCP api.wppw.pl.
    - |
      HTTP=$(curl -s -o resp.txt -w "%{http_code}" -X POST \
        -H "X-Service-Key: $WPPW_SERVICE_KEY" \
        -H "Origin: $ORIGIN" \
        -A "wfs-gitlab-ci/1.0" \
        -F "version=${VERSION}" \
        -F "sha256=${SHA}" \
        -F "uploaderEmail=${WPPW_UPLOADER_EMAIL:-wit.paw4@gmail.com}" \
        -F "productName=Wolfie Font Swapper" \
        -F "uploadOrigin=gitlab-ci" \
        -F "file=@${ZIP}" \
        "$URL")
      echo "HTTP $HTTP"
      echo "--- response ---"; cat resp.txt; echo
      case "$HTTP" in
        2*) echo "OK — release $VERSION wysłany do api.wppw.pl" ;;
        *)  echo "Upload failed (HTTP $HTTP)"; exit 1 ;;
      esac
